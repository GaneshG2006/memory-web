services:
  db:
    image: postgres:16
    container_name: memory-web-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: memory_web
      POSTGRES_USER: memory_user
      POSTGRES_PASSWORD: memory_dev_password
    ports:
      - "5432:5432"
    volumes:
      - memory_web_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_user -d memory_web"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memory_web_data:
